<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator Unit Tests</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 16px; background: #f3f6f4; color: #1d2a24; }
    h1 { font-size: 22px; }
    #test-summary { font-size: 18px; font-weight: 700; padding: 12px; border-radius: 8px; }
    .all-pass { background: #e3f5ea; color: #157a41; }
    .some-fail { background: #fde8e8; color: #d64545; }
    ul { list-style: none; padding: 0; }
    li { font-family: Consolas, monospace; padding: 8px 10px; margin: 6px 0; border-radius: 6px; background: #fff; border-left: 5px solid; white-space: pre-wrap; }
    li.pass { border-color: #1f9d55; }
    li.fail { border-color: #d64545; }
  </style>
</head>
<body>
  <h1>Unit Tests: calculateChargingCost()</h1>
  <p id="test-summary"></p>
  <ul id="test-list"></ul>

  <script src="../js/calculator.js"></script>
  <script src="calculator.test.js"></script>
</body>
</html>
